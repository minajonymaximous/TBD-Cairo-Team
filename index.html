  <style>
    :root {
      --navy: #0F294A;
      --navy-2: #193B66;
      --accent: #2563EB;
      --accent-soft: #EFF6FF;
      --green: #16A34A;
      --green-soft: #DCFCE7;
      --amber: #D97706;
      --amber-soft: #FEF3C7;
      --red: #DC2626;
      --red-soft: #FEE2E2;
      --bg: #F3F6FA;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
      --radius: 14px;
      --shadow: 0 4px 16px rgba(15, 41, 74, 0.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Cairo', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .num { font-family: 'Inter', 'Cairo', sans-serif; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(155deg, #09192E 0%, #0F294A 55%, #1D4ED8 140%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .brand-mark {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand-title {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--navy);
      direction: ltr;
      unicode-bidi: isolate;
    }
    .brand-title .tbd-caps {
      color: var(--accent);
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin-top: 2px;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .field-group {
      text-align: right;
      margin-bottom: 14px;
    }
    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .input-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      background: #F8FAFC;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-control:focus {
      border-color: var(--accent);
      background: #FFFFFF;
    }
    .pin-input {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s, background 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      background: var(--navy);
      color: #FFFFFF;
    }
    .btn-primary:hover { background: var(--navy-2); }
    .btn-accent {
      background: var(--accent);
      color: #FFFFFF;
    }
    .btn-outline {
      background: #FFFFFF;
      color: var(--navy);
      border: 1.5px solid var(--border);
    }
    .btn-soft-green {
      background: var(--green-soft);
      color: #15803D;
    }
    .btn-soft-amber {
      background: var(--amber-soft);
      color: #B45309;
    }
    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 10px;
    }
    .error-msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
    }

    .app-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }
    .top-banner {
      background: linear-gradient(135deg, #0F294A 0%, #1B3F6E 100%);
      color: #FFFFFF;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .top-banner .brand-title {
      color: #FFFFFF;
      font-size: 24px;
    }
    .top-banner .brand-title .tbd-caps {
      color: #60A5FA;
    }
    .top-banner .brand-sub {
      color: #CBD5E1;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      margin-top: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ADE80;
    }
    .dot.syncing { background: #FBBF24; }
    .dot.offline { background: #F87171; }
    .banner-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .kpi-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      color: var(--navy);
      margin: 4px 0 2px;
    }
    .kpi-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .panel-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
    }
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .search-row .input-control {
      flex: 1 1 240px;
      background: #FFFFFF;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--navy);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .rep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
      gap: 12px;
    }
    .rep-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rep-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      background: #E2E8F0;
      color: #1E293B;
    }
    .rank-1 { background: #FEF08A; color: #854D0E; }
    .rank-2 { background: #E2E8F0; color: #334155; }
    .rank-3 { background: #FED7AA; color: #9A3412; }
    .rep-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
    }
    .ach-pill {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .ach-high { background: var(--green-soft); color: #15803D; }
    .ach-mid { background: var(--amber-soft); color: #B45309; }
    .ach-low { background: var(--red-soft); color: #B91C1C; }
    .progress-track {
      height: 8px;
      width: 100%;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .rep-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #F8FAFC;
      padding: 9px;
      border-radius: 10px;
      font-size: 12px;
    }
    .rep-metrics span { display: block; color: var(--muted); font-size: 11px; }
    .rep-metrics strong { color: var(--text); font-size: 13px; }
    .rep-actions {
      display: flex;
      gap: 8px;
    }
    .rep-actions .btn { flex: 1; }

    .pharm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }
    .pharm-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #FFFFFF;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pharm-card:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.08);
    }
    .pharm-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .pharm-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
    }
    .pharm-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .note-badge {
      background: var(--amber-soft);
      color: #92400E;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 9px;
      word-break: break-word;
    }
    .pharm-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      padding-top: 6px;
      border-top: 1px dashed #E2E8F0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-box {
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
    }
    .sku-row {
      display: grid;
      grid-template-columns: 1fr 92px 84px;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 8px;
      background: #F8FAFC;
    }
    .sku-name { font-size: 13px; font-weight: 700; }
    .sku-price { font-size: 11px; color: var(--muted); }
    .qty-input {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      background: #FFFFFF;
    }
    .pull-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pull-toggle.checked {
      background: var(--green-soft);
      border-color: #86EFAC;
      color: #15803D;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .target-edit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 8px;
      background: #F8FAFC;
    }
    .target-edit-row input {
      width: 150px;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 80;
    }
  </style>
</head>
<body>

  <section id="loginScreen">
    <div class="login-card">
      <div class="brand-mark">
        <div class="brand-title"><span class="tbd-caps">TBD</span> Cairo T.</div>
        <div class="brand-sub">Target Breakdown • Cairo Team</div>
      </div>

      <div class="field-group">
        <label class="field-label" for="loginRole">اختر الحساب</label>
        <select id="loginRole" class="input-control">
          <option value="Manager">Manager</option>
          <option value="Mina">Mina</option>
          <option value="Fady">Fady</option>
          <option value="Mriham">Mriham</option>
          <option value="Margelet">Margelet</option>
          <option value="Antonious">Antonious</option>
          <option value="Michael">Michael</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="loginPin">الرقم السري (4 أرقام)</label>
        <input id="loginPin" type="password" inputmode="numeric" maxlength="4" class="input-control pin-input" placeholder="••••" autocomplete="off" />
      </div>

      <button id="loginBtn" class="btn btn-primary">دخول</button>
      <div id="loginError" class="error-msg hidden"></div>
    </div>
  </section>

  <main id="appScreen" class="app-wrap hidden">
    <header class="top-banner">
      <div>
        <div class="brand-title"><span class="tbd-caps">TBD</span> Cairo T.</div>
        <div id="sessionSub" class="brand-sub">Target Breakdown • Cairo Team</div>
        <div class="sync-pill">
          <span id="syncDot" class="dot"></span>
          <span id="syncStatusText">متصل بالشيت</span>
        </div>
      </div>
      <div class="banner-actions">
        <button id="syncNowBtn" class="btn btn-soft-green btn-sm">مزامنة الآن</button>
        <button id="addPharmBtn" class="btn btn-accent btn-sm">+ إضافة صيدلية</button>
        <button id="targetsModalBtn" class="btn btn-soft-amber btn-sm hidden">تعديل التارجت</button>
        <button id="logoutBtn" class="btn btn-outline btn-sm">خروج</button>
      </div>
    </header>

    <section id="kpiStrip" class="kpi-grid"></section>

    <section id="managerRankSection" class="panel hidden">
      <div class="panel-header">
        <h2 class="panel-title">ترتيب الفريق (من الأعلى للأقل)</h2>
        <span id="rankHint" class="kpi-sub">مرتب حسب نسبة التحقيق</span>
      </div>
      <div id="repRankGrid" class="rep-grid"></div>
    </section>

    <div id="managerTabsBar" class="tabs-bar hidden"></div>

    <section class="panel">
      <div class="panel-header">
        <h2 id="activeRepHeading" class="panel-title">الصيدليات</h2>
        <div id="activeRepTargetBox" class="kpi-sub"></div>
      </div>
      <div class="search-row">
        <input id="searchInput" type="search" class="input-control" placeholder="ابحث باسم الصيدلية أو الكود أو الأسبوع أو الملاحظات..." />
      </div>
      <div class="filter-chips">
        <button class="chip active" data-filter="all">الكل</button>
        <button class="chip" data-filter="pulled">تم السحب</button>
        <button class="chip" data-filter="pending">لم يُسحب بعد</button>
        <button class="chip" data-filter="notes">بها ملاحظات / بونص</button>
      </div>
    </section>

    <section id="pharmGrid" class="pharm-grid"></section>
  </main>

  <div id="pharmModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <h3 id="modalPharmName" class="modal-title"></h3>
          <div id="modalPharmMeta" class="kpi-sub"></div>
        </div>
        <button id="closePharmModal" class="btn btn-outline btn-sm">إغلاق</button>
      </div>

      <div id="skuEditorList"></div>

      <div class="field-group" style="margin-top: 12px;">
        <label class="field-label" for="modalNoteInput">ملاحظات / Bonus</label>
        <textarea id="modalNoteInput" rows="2" class="input-control" placeholder="اكتب ملاحظة أو بونص للصيدلية..."></textarea>
        <div class="presets">
          <button type="button" class="chip preset-chip" data-preset="+ Bonus">+ Bonus</button>
          <button type="button" class="chip preset-chip" data-preset="تم التسليم بالكامل">تم التسليم بالكامل</button>
          <button type="button" class="chip preset-chip" data-preset="تأجيل للأسبوع القادم">تأجيل للأسبوع القادم</button>
          <button type="button" class="chip preset-chip" data-preset="متابعة مع المدير">متابعة مع المدير</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px;">
        <div id="modalPharmTotal" style="font-weight: 800; color: var(--navy);"></div>
        <button id="savePharmBtn" class="btn btn-primary" style="width: auto; padding: 11px 22px;">حفظ ومزامنة</button>
      </div>
    </div>
  </div>

  <div id="addPharmModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 class="modal-title">إضافة صيدلية جديدة</h3>
        <button id="closeAddModal" class="btn btn-outline btn-sm">إغلاق</button>
      </div>
      <div class="field-group">
        <label class="field-label" for="newPharmName">اسم الصيدلية</label>
        <input id="newPharmName" type="text" class="input-control" placeholder="مثال: صيدلية النور" />
      </div>
      <div class="field-group">
        <label class="field-label" for="newPharmCode">كود الصيدلية (Ph Code)</label>
        <input id="newPharmCode" type="text" class="input-control" placeholder="مثال: 10452" />
      </div>
      <div class="field-group">
        <label class="field-label" for="newPharmWeek">الأسبوع / الموعد</label>
        <input id="newPharmWeek" type="text" class="input-control" placeholder="مثال: 2nd week" />
      </div>
      <div class="field-group">
        <label class="field-label" for="newPharmNote">ملاحظات / Bonus (اختياري)</label>
        <input id="newPharmNote" type="text" class="input-control" placeholder="مثال: + Bonus 5" />
      </div>
      <button id="confirmAddPharmBtn" class="btn btn-primary">إضافة ومزامنة مع الشيت</button>
    </div>
  </div>

  <div id="targetModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 class="modal-title">تعديل التارجت الشهري للفريق (EGP)</h3>
        <button id="closeTargetModal" class="btn btn-outline btn-sm">إغلاق</button>
      </div>
      <div id="targetInputsList"></div>
      <button id="saveAllTargetsBtn" class="btn btn-primary" style="margin-top: 10px;">حفظ التارجت ومزامنته مع الشيت</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

    let state = loadState();
    let currentRole = null;
    let activeRep = "Antonious";
    let activeFilter = "all";
    let searchQuery = "";
    let editingPharmIndex = null;
    let draftItems = [];
    let syncTimer = null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.reps) return parsed;
        }
      } catch (e) {}
      return { reps: JSON.parse(JSON.stringify(INITIAL_DATA)), lastSync: null };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add("hidden"), 2400);
    }

    function setSyncStatus(mode, label) {
      const dot = document.getElementById("syncDot");
      const txt = document.getElementById("syncStatusText");
      dot.className = "dot" + (mode ? " " + mode : "");
      txt.textContent = label;
    }

    function normalizeAr(str) {
      return String(str || "")
        .toLowerCase()
        .replace(/[أإآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/ؤ/g, "و")
        .replace(/ئ/g, "ي")
        .trim();
    }

    function fmtNum(n) {
      return Math.round(Number(n) || 0).toLocaleString("en-US");
    }

    function computePharmStats(pharm) {
      let planQty = 0, pulledQty = 0, planVal = 0, actVal = 0, pulledSkus = 0, activeSkus = 0;
      (pharm.i || []).forEach((pair, idx) => {
        const q = Number(pair[0]) || 0;
        const pulled = Boolean(pair[1]);
        const p = PRICES[idx] || 0;
        if (q > 0) {
          activeSkus++;
          planQty += q;
          planVal += q * p;
          if (pulled) {
            pulledSkus++;
            pulledQty += q;
            actVal += q * p;
          }
        }
      });
      const pct = planVal > 0 ? (actVal / planVal) * 100 : 0;
      return { planQty, pulledQty, planVal, actVal, pulledSkus, activeSkus, pct };
    }

    function computeRepStats(repKey) {
      const repObj = state.reps[repKey] || { target: 0, custs: [] };
      let planVal = 0, actVal = 0, pulledPharmCount = 0;
      (repObj.custs || []).forEach(c => {
        const st = computePharmStats(c);
        planVal += st.planVal;
        actVal += st.actVal;
        if (st.pulledQty > 0) pulledPharmCount++;
      });
      const target = Number(repObj.target) || 0;
      const achPct = target > 0 ? (actVal / target) * 100 : 0;
      const remaining = Math.max(0, target - actVal);
      return {
        rep: repKey,
        target,
        planVal,
        actVal,
        achPct,
        remaining,
        pharmCount: (repObj.custs || []).length,
        pulledPharmCount
      };
    }

    function getRankedReps() {
      return REP_ORDER.map(computeRepStats).sort((a, b) => {
        if (Math.abs(b.achPct - a.achPct) > 0.001) return b.achPct - a.achPct;
        return b.actVal - a.actVal;
      });
    }

    async function pullFromSheet(silent = false) {
      if (!DEFAULT_API_URL) return;
      setSyncStatus("syncing", "جاري المزامنة...");
      try {
        const pinCode = currentRole ? PINS[currentRole] : "";
        const url = `${DEFAULT_API_URL}?pin=${encodeURIComponent(pinCode)}&t=${Date.now()}`;
        const res = await fetch(url);
        const json = await res.json();
        if (json && json.status === "ok" && json.data) {
          const notesMap = {};
          (json.notes || []).forEach(n => {
            const key = `${String(n.rep).trim()}||${String(n.code).trim()}||${String(n.name).trim()}`;
            notesMap[key] = n.note || "";
          });

          Object.keys(json.data).forEach(repKey => {
            if (!state.reps[repKey]) return;
            const remoteRep = json.data[repKey];
            if (typeof remoteRep.target === "number") {
              state.reps[repKey].target = remoteRep.target;
            }
            if (Array.isArray(remoteRep.custs) && remoteRep.custs.length > 0) {
              state.reps[repKey].custs = remoteRep.custs.map(rc => {
                const key = `${repKey}||${String(rc.c || "").trim()}||${String(rc.n || "").trim()}`;
                return {
                  r: rc.r,
                  c: rc.c || "",
                  n: rc.n || "",
                  d: rc.d || "",
                  i: rc.i || [],
                  note: notesMap[key] || ""
                };
              });
            }
          });
          state.lastSync = new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
          saveState();
          setSyncStatus("", `متصل بالشيت • ${state.lastSync}`);
          renderApp();
          if (!silent) showToast("تم التحديث من الشيت");
        } else {
          setSyncStatus("offline", "تعذر المزامنة");
        }
      } catch (err) {
        setSyncStatus("offline", "وضع غير متصل مؤقتاً");
      }
    }

    async function pushToSheet(payload) {
      if (!DEFAULT_API_URL) return;
      setSyncStatus("syncing", "جاري الحفظ في الشيت...");
      try {
        await fetch(DEFAULT_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        state.lastSync = new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
        saveState();
        setSyncStatus("", `محفوظ في الشيت • ${state.lastSync}`);
      } catch (e) {
        setSyncStatus("offline", "محفوظ محلياً • بانتظار الشبكة");
      }
    }

    function renderApp() {
      if (!currentRole) return;
      const isManager = currentRole === "Manager";
      document.getElementById("sessionSub").textContent = isManager
        ? "Manager View • Target Breakdown"
        : `${currentRole} • Target Breakdown`;
      document.getElementById("targetsModalBtn").classList.toggle("hidden", !isManager);
      document.getElementById("managerRankSection").classList.toggle("hidden", !isManager);
      document.getElementById("managerTabsBar").classList.toggle("hidden", !isManager);

      if (isManager) {
        renderManagerLeaderboard();
        renderManagerTabs();
      } else {
        activeRep = currentRole;
      }

      renderKpis();
      renderActiveRepHeader();
      renderPharmacies();
    }

    function renderKpis() {
      const isManager = currentRole === "Manager";
      let totalTarget = 0, totalPlan = 0, totalAct = 0, totalPharms = 0;
      const scopeReps = isManager ? REP_ORDER : [activeRep];
      scopeReps.forEach(r => {
        const st = computeRepStats(r);
        totalTarget += st.target;
        totalPlan += st.planVal;
        totalAct += st.actVal;
        totalPharms += st.pharmCount;
      });
      const ach = totalTarget > 0 ? ((totalAct / totalTarget) * 100).toFixed(1) : "0.0";
      const rem = Math.max(0, totalTarget - totalAct);

      document.getElementById("kpiStrip").innerHTML = `
        <div class="kpi-card">
          <div class="kpi-title">المحقق الفعلي (Actual)</div>
          <div class="kpi-val num">${fmtNum(totalAct)} <span style="font-size:12px">EGP</span></div>
          <div class="kpi-sub num">نسبة التحقيق: ${ach}%</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">التارجت الشهري (Target)</div>
          <div class="kpi-val num">${fmtNum(totalTarget)} <span style="font-size:12px">EGP</span></div>
          <div class="kpi-sub num">المتبقي: ${fmtNum(rem)} EGP</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">المخطط (Planned)</div>
          <div class="kpi-val num">${fmtNum(totalPlan)} <span style="font-size:12px">EGP</span></div>
          <div class="kpi-sub">${isManager ? "إجمالي الفريق" : activeRep}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">عدد الصيدليات</div>
          <div class="kpi-val num">${totalPharms}</div>
          <div class="kpi-sub">${isManager ? "6 حسابات" : "حساب " + activeRep}</div>
        </div>
      `;
    }

    function renderManagerLeaderboard() {
      const ranked = getRankedReps();
      const grid = document.getElementById("repRankGrid");
      grid.innerHTML = ranked.map((r, idx) => {
        const rankNum = idx + 1;
        const badgeClass = rankNum === 1 ? "rank-1" : rankNum === 2 ? "rank-2" : rankNum === 3 ? "rank-3" : "";
        const achClass = r.achPct >= 75 ? "ach-high" : r.achPct >= 40 ? "ach-mid" : "ach-low";
        const barW = Math.min(100, Math.max(0, r.achPct));
        const isSelected = activeRep === r.rep;
        return `
          <div class="rep-card" style="${isSelected ? "border-color: var(--accent); box-shadow: 0 6px 18px rgba(37,99,235,0.1);" : ""}">
            <div class="rep-top">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="rank-badge ${badgeClass}">#${rankNum}</span>
                <span class="rep-name">${r.rep}</span>
              </div>
              <span class="ach-pill num ${achClass}">${r.achPct.toFixed(1)}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${barW}%"></div></div>
            <div class="rep-metrics num">
              <div><span>المحقق</span><strong>${fmtNum(r.actVal)}</strong></div>
              <div><span>التارجت</span><strong>${fmtNum(r.target)}</strong></div>
              <div><span>الصيدليات</span><strong>${r.pharmCount}</strong></div>
            </div>
            <div class="rep-actions">
              <button class="btn btn-outline btn-sm" onclick="selectRep('${r.rep}')">عرض الصيدليات</button>
              <button class="btn btn-soft-amber btn-sm" onclick="openSingleTargetEdit('${r.rep}')">تعديل التارجت</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderManagerTabs() {
      const bar = document.getElementById("managerTabsBar");
      bar.innerHTML = REP_ORDER.map(rep => `
        <button class="tab-btn ${activeRep === rep ? "active" : ""}" onclick="selectRep('${rep}')">${rep}</button>
      `).join("");
    }

    function selectRep(rep) {
      activeRep = rep;
      renderApp();
    }

    function renderActiveRepHeader() {
      const st = computeRepStats(activeRep);
      document.getElementById("activeRepHeading").textContent = `صيدليات ${activeRep}`;
      document.getElementById("activeRepTargetBox").innerHTML = `
        <span class="num">التارجت: <strong>${fmtNum(st.target)}</strong> EGP • المحقق: <strong>${fmtNum(st.actVal)}</strong> EGP (${st.achPct.toFixed(1)}%)</span>
      `;
    }

    function renderPharmacies() {
      const repObj = state.reps[activeRep] || { custs: [] };
      const q = normalizeAr(searchQuery);
      const list = (repObj.custs || []).map((c, idx) => ({ c, idx, st: computePharmStats(c) })).filter(({ c, st }) => {
        if (activeFilter === "pulled" && st.pulledQty <= 0) return false;
        if (activeFilter === "pending" && st.pulledQty > 0) return false;
        if (activeFilter === "notes" && !(c.note && c.note.trim())) return false;
        if (!q) return true;
        const hay = normalizeAr(`${c.n} ${c.c} ${c.d} ${c.note || ""}`);
        return hay.includes(q);
      });

      const grid = document.getElementById("pharmGrid");
      if (!list.length) {
        grid.innerHTML = `<div class="panel" style="grid-column:1/-1;text-align:center;color:var(--muted);">لا توجد صيدليات مطابقة للبحث.</div>`;
        return;
      }

      grid.innerHTML = list.map(({ c, idx, st }) => {
        const pctLabel = `${st.pct.toFixed(0)}%`;
        const statusColor = st.pct >= 100 ? "#15803D" : st.pct > 0 ? "#B45309" : "#64748B";
        return `
          <div class="pharm-card" onclick="openPharmModal(${idx})">
            <div class="pharm-head">
              <div class="pharm-title">${escapeHtml(c.n || "بدون اسم")}</div>
              <span class="num" style="font-weight:800;color:${statusColor}">${pctLabel}</span>
            </div>
            <div class="pharm-meta num">
              <span>Code: ${escapeHtml(c.c || "-")}</span>
              ${c.d ? `<span>• ${escapeHtml(c.d)}</span>` : ""}
              <span>• SKUs: ${st.pulledSkus}/${st.activeSkus}</span>
            </div>
            ${c.note && c.note.trim() ? `<div class="note-badge">${escapeHtml(c.note.trim())}</div>` : ""}
            <div class="pharm-foot num">
              <span>المخطط: ${fmtNum(st.planVal)} EGP</span>
              <span style="color:var(--navy)">المحقق: ${fmtNum(st.actVal)} EGP</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function openPharmModal(idx) {
      const pharm = state.reps[activeRep].custs[idx];
      if (!pharm) return;
      editingPharmIndex = idx;
      draftItems = (pharm.i || []).map(pair => [Number(pair[0]) || 0, pair[1] ? 1 : 0]);
      while (draftItems.length < 8) draftItems.push([0, 0]);

      document.getElementById("modalPharmName").textContent = pharm.n;
      document.getElementById("modalPharmMeta").textContent = `${activeRep} • Code: ${pharm.c || "-"} ${pharm.d ? "• " + pharm.d : ""}`;
      document.getElementById("modalNoteInput").value = pharm.note || "";
      renderSkuEditor();
      document.getElementById("pharmModal").classList.remove("hidden");
    }

    function renderSkuEditor() {
      const container = document.getElementById("skuEditorList");
      let totalAct = 0;
      container.innerHTML = SKUS.map((sku, idx) => {
        const qty = Number(draftItems[idx][0]) || 0;
        const pulled = Boolean(draftItems[idx][1]);
        if (pulled) totalAct += qty * PRICES[idx];
        return `
          <div class="sku-row">
            <div>
              <div class="sku-name">${sku}</div>
              <div class="sku-price num">${PRICES[idx].toFixed(2)} EGP</div>
            </div>
            <input type="number" min="0" class="qty-input" value="${qty || ""}" placeholder="0" onchange="updateDraftQty(${idx}, this.value)" />
            <button type="button" class="pull-toggle ${pulled ? "checked" : ""}" onclick="toggleDraftPull(${idx})">
              ${pulled ? "✓ Pulled" : "Pulled"}
            </button>
          </div>
        `;
      }).join("");
      document.getElementById("modalPharmTotal").textContent = `إجمالي المحقق: ${fmtNum(totalAct)} EGP`;
    }

    function updateDraftQty(idx, val) {
      draftItems[idx][0] = Math.max(0, Math.floor(Number(val) || 0));
      renderSkuEditor();
    }

    function toggleDraftPull(idx) {
      draftItems[idx][1] = draftItems[idx][1] ? 0 : 1;
      renderSkuEditor();
    }

    document.querySelectorAll(".preset-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const ta = document.getElementById("modalNoteInput");
        const preset = btn.dataset.preset;
        ta.value = ta.value.trim() ? `${ta.value.trim()} | ${preset}` : preset;
      });
    });

    document.getElementById("savePharmBtn").addEventListener("click", async () => {
      if (editingPharmIndex === null) return;
      const pharm = state.reps[activeRep].custs[editingPharmIndex];
      const noteText = document.getElementById("modalNoteInput").value.trim();
      pharm.i = draftItems.map(p => [Number(p[0]) || 0, p[1] ? 1 : 0]);
      pharm.note = noteText;
      saveState();
      document.getElementById("pharmModal").classList.add("hidden");
      renderApp();
      showToast("تم الحفظ والمزامنة");
      await pushToSheet({
        action: "updatePharmacy",
        rep: activeRep,
        row: pharm.r,
        code: pharm.c,
        name: pharm.n,
        items: pharm.i,
        note: pharm.note
      });
    });

    document.getElementById("closePharmModal").addEventListener("click", () => {
      document.getElementById("pharmModal").classList.add("hidden");
    });

    document.getElementById("addPharmBtn").addEventListener("click", () => {
      document.getElementById("newPharmName").value = "";
      document.getElementById("newPharmCode").value = "";
      document.getElementById("newPharmWeek").value = "";
      document.getElementById("newPharmNote").value = "";
      document.getElementById("addPharmModal").classList.remove("hidden");
    });
    document.getElementById("closeAddModal").addEventListener("click", () => {
      document.getElementById("addPharmModal").classList.add("hidden");
    });
    document.getElementById("confirmAddPharmBtn").addEventListener("click", async () => {
      const name = document.getElementById("newPharmName").value.trim();
      if (!name) {
        showToast("اكتب اسم الصيدلية أولاً");
        return;
      }
      const code = document.getElementById("newPharmCode").value.trim();
      const week = document.getElementById("newPharmWeek").value.trim();
      const note = document.getElementById("newPharmNote").value.trim();
      const custs = state.reps[activeRep].custs;
      const nextRow = custs.length ? (custs[custs.length - 1].r + 1) : 10;
      const newPharm = {
        r: nextRow,
        c: code,
        n: name,
        d: week,
        i: Array.from({ length: 8 }, () => [0, 0]),
        note
      };
      custs.push(newPharm);
      saveState();
      document.getElementById("addPharmModal").classList.add("hidden");
      renderApp();
      showToast("تمت إضافة الصيدلية");
      await pushToSheet({
        action: "addPharmacy",
        rep: activeRep,
        code,
        name,
        date: week,
        items: newPharm.i,
        note
      });
    });

    function openTargetModal(focusRep = null) {
      if (currentRole !== "Manager") return;
      const container = document.getElementById("targetInputsList");
      container.innerHTML = REP_ORDER.map(rep => {
        const curTarget = Number((state.reps[rep] && state.reps[rep].target) || 0);
        return `
          <div class="target-edit-row">
            <strong>${rep}</strong>
            <input type="number" min="0" step="1" class="input-control target-field" data-rep="${rep}" value="${curTarget}" />
          </div>
        `;
      }).join("");
      document.getElementById("targetModal").classList.remove("hidden");
      if (focusRep) {
        const inp = container.querySelector(`input[data-rep="${focusRep}"]`);
        if (inp) inp.focus();
      }
    }

    function openSingleTargetEdit(rep) {
      openTargetModal(rep);
    }

    document.getElementById("targetsModalBtn").addEventListener("click", () => openTargetModal());
    document.getElementById("closeTargetModal").addEventListener("click", () => {
      document.getElementById("targetModal").classList.add("hidden");
    });

    document.getElementById("saveAllTargetsBtn").addEventListener("click", async () => {
      if (currentRole !== "Manager") return;
      const inputs = document.querySelectorAll("#targetInputsList .target-field");
      const updates = [];
      inputs.forEach(inp => {
        const rep = inp.dataset.rep;
        const val = Math.max(0, Number(inp.value) || 0);
        if (!state.reps[rep]) state.reps[rep] = { target: 0, custs: [] };
        if (state.reps[rep].target !== val) {
          state.reps[rep].target = val;
          updates.push({ rep, target: val });
        }
      });
      saveState();
      document.getElementById("targetModal").classList.add("hidden");
      renderApp();
      showToast("تم تحديث التارجت");
      for (const u of updates) {
        await pushToSheet({
          action: "updateTarget",
          pin: PINS.Manager,
          rep: u.rep,
          target: u.target
        });
      }
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value;
      renderPharmacies();
    });
    document.querySelectorAll(".filter-chips .chip").forEach(ch => {
      ch.addEventListener("click", () => {
        document.querySelectorAll(".filter-chips .chip").forEach(x => x.classList.remove("active"));
        ch.classList.add("active");
        activeFilter = ch.dataset.filter;
        renderPharmacies();
      });
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const role = document.getElementById("loginRole").value;
      const pin = document.getElementById("loginPin").value.trim();
      const errEl = document.getElementById("loginError");
      if (PINS[role] !== pin) {
        errEl.textContent = "الرقم السري غير صحيح";
        errEl.classList.remove("hidden");
        return;
      }
      errEl.classList.add("hidden");
      currentRole = role;
      activeRep = role === "Manager" ? getRankedReps()[0].rep : role;
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");
      renderApp();
      await pullFromSheet(true);
      clearInterval(syncTimer);
      syncTimer = setInterval(() => pullFromSheet(true), 45000);
    });

    document.getElementById("loginPin").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("syncNowBtn").addEventListener("click", () => pullFromSheet(false));

    document.getElementById("logoutBtn").addEventListener("click", () => {
      currentRole = null;
      clearInterval(syncTimer);
      document.getElementById("loginPin").value = "";
      document.getElementById("appScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentRole) {
        pullFromSheet(true);
      }
    });
  </script>
</body>
</html>
